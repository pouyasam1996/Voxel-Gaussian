# Every setting of the project. Defaults reproduce the gaussian-slam baseline
# (scripts/step4_fusion/refuse_rounds.py: 3 rounds x 1000 steps, ATE 3.48 -> 1.65 -> 0.91 cm).
# Experiments in yamls/experiments/ change only a few of these values.
# Rule: a new setting is added here first; experiment files may not add new keys.

slam:                      # camera poses from scratch (scripts/run_odometry.py)
  methods: [dense, orb]    # odometry baselines to run: dense (Open3D), orb (OpenCV)
  max_width: 640           # shrink images (keep every n-th pixel) to at most this width
  frame_step: 1            # use every n-th frame (tracking needs small motions: keep 1)
  max_frames: null         # stop after this many frames (null = all)
  depth_max: 4.0           # ignore depth beyond this, metres (real sensors get noisy)
  dense:                   # Open3D dense RGB-D alignment (legacy pipeline: runs on any CPU)
    method: hybrid         # hybrid (depth + brightness) or intensity (brightness only)
    iterations: [10, 5, 3] # Gauss-Newton steps per pyramid level, coarse -> fine
    depth_outlier_trunc: 0.07    # ignore pixel pairs with a larger depth gap, metres
  orb:                     # ORB feature odometry; feature settings as in ORB-SLAM3's TUM files
    features: 1000
    scale_factor: 1.2      # size ratio between pyramid levels
    levels: 8
    ratio: 0.7             # keep a match if best distance < ratio x second best
    ransac_px: 3.0         # a 2D-3D match agrees with a pose within this many pixels
    min_inliers: 20        # fewer: tracking failed for this frame
  tracker:                 # keyframe tracker (scripts/run_slam.py); also uses orb, dense above
    keyframe_max_translation: 0.10   # new keyframe after moving this far from the last one, m
    keyframe_max_rotation_deg: 6.0   # ... or turning this much
    keyframe_max_frames: 30          # ... or after this many frames (1 s at 30 frames/s)
    keyframe_min_inlier_ratio: 0.75  # ... or when inliers drop below this share of the first frame's
    keyframe_dense_iterations: [20, 10, 10]  # keyframe-to-keyframe dense alignment, coarse -> fine
    max_jump_translation: 0.05       # reject a pose this far from the constant-velocity guess, m
    max_jump_rotation_deg: 5.0       # ... or turned this much from it
    edge_depth_ratio: 0.05           # drop feature depth if its 3x3 patch spans > 5% (object edges)
    fuse_px: 5.0                     # a neighbour's map point must project this close to a feature
    refine_with_depth: true          # after RANSAC, refine each frame's pose with pixel + depth
    reloc_max_distance: 0.5          # relocalized pose must be this close to the last good one, m
    reloc_free_after: 30             # ... unless lost for this many frames (then anywhere)
  ba:                      # local bundle adjustment at each keyframe (GTSAM)
    enabled: true          # false = keyframes only, no bundle adjustment (step 2a)
    window: 10             # keyframes optimized: the new one + those sharing the most points
    min_shared_points: 15  # keyframes count as neighbours when sharing at least this many points
    iterations: 10         # Levenberg-Marquardt iterations per solve (two solves)
    baseline: 0.08         # virtual stereo baseline turning depth into a pixel, m (ORB-SLAM3 TUM ~0.077)
    chi2: 7.815            # 95% limit for a 3-number error: above = outlier; Huber at sqrt(chi2)
    link_chi2: 12.59       # 95% limit for a 6-number error: a map alignment above it is dropped
    dense_links: true      # add keyframe-to-keyframe dense alignments as pose-to-pose springs
    dense_link_sigma: 0.0007 # typical error of one dense keyframe link, m. Depends on the depth
                             # sensor: 0.0007 tuned on Replica; TUM in yamls/experiments/tum.yaml
    max_fixed_keyframes: 20  # anchor keyframes kept (those sharing the most points); speed cap
  reuse:                   # coming back to mapped areas ("light loop closure"), at each keyframe
    enabled: true          # only with bundle adjustment on
    skip_recent: 20        # keyframes this recent are ordinary neighbours, not revisits
    max_distance: 1.0      # candidate old keyframe: camera centres within this distance, m
    max_angle_deg: 30.0    # ... and viewing directions within this angle
    max_keyframes: 3       # check at most this many candidates, closest first
    search_px: 15.0        # an old point may land this far from its feature (drift), px
    max_hamming: 50        # descriptor bits allowed to differ (of 256)
    min_inliers: 30        # geometric check: pose from the old points needs this many inliers
    max_correction: 0.2    # reject if snapping onto the old map moves the keyframe more, m
    max_correction_deg: 5.0  # ... or turns it more, degrees
  map:                     # voxel map built while tracking (TSDF settings: tsdf section below)
    enabled: true
    settle_after: 10       # fuse a keyframe once this many newer ones exist (left BA's window)
    refuse_translation: 0.01   # re-fuse a fused keyframe that BA moved more than this, m
    refuse_rotation_deg: 0.5   # ... or turned more than this
    icp_links: true        # align each new keyframe to the settled map: a link in BA
    icp_points: 2000       # depth points per alignment
    icp_iters: 10
    icp_huber: 0.02        # gaps beyond this count linearly, m
    icp_min_overlap: 0.3   # share of points that must land on mapped surface
    icp_max_correction: 0.05   # reject an alignment that moves the keyframe more, m
    icp_max_correction_deg: 3.0
    icp_link_sigma: 0.002  # typical error of one map alignment, m (stiffness scale, to calibrate)

data:
  dataset: replica_room0   # yamls/datasets/<name>.yaml
  every: 20                # use every n-th frame for training (held-out frames sit halfway between)
  stride: 4                # training images: keep every n-th pixel (1200x680 -> 300x170)
  fuse_stride: 2           # depth/colour used for fusion: every n-th pixel
  limit: null              # stop after this many frames (null = all)

noise:                     # synthetic pose error added to the true poses
  mode: random             # none, random (independent per frame) or drift (adds up)
  rot_deg: 1.0             # per frame, degrees (drift: per-frame step)
  trans_m: 0.02            # per frame, metres
  seed: 0

tsdf:
  voxel: 0.05              # voxel size, metres
  block: 8                 # voxels per block side (8x8x8 blocks)
  trunc_voxels: 4.0        # truncation band, in voxels (4 x 5 cm = 20 cm)
  depth_max: 10.0          # ignore depth beyond this, metres
  min_weight: 1.0          # surface: only voxels seen by more frames than this

icp:                       # snapping each camera onto the fused surface with its depth
  iters: 5                 # 0 = off
  max_dist: 0.1            # ignore pairs further apart, metres
  sample: 4                # use every n-th depth pixel
  damping: 1.0e-6          # keeps directions without grip from drifting
  min_pairs: 100           # fewer pairs: leave the camera as it is
  refuse_after_snap: true  # fuse again with the snapped poses before building Gaussians

gaussians:                 # flat blobs built from the surface, one per surface voxel
  width: 0.5               # across the surface, in voxels (standard deviation)
  thickness: 0.1           # along the normal, in voxels
  opacity: 0.9             # starting opacity
  sh_degree: 0             # 0 = one colour per blob

refine:                    # joint training of Gaussians and camera corrections
  steps: 1000              # rendered images per round (0 = no Gaussian training)
  warmup: 200              # Gaussian-only steps before the cameras train too
  depth_weight: 1.0        # depth L1 (m) against colour L1
  anchor_weight: 100.0     # penalty for blobs beyond anchor_radius
  anchor_radius: 1.0       # free movement, in voxels
  lr_means: 2.0e-4
  lr_colors: 0.0025
  lr_opacity: 0.01
  lr_scales: 0.002
  lr_quats: 0.001
  lr_rot: 0.005            # camera rotation correction, radians
  lr_trans: 0.005          # camera shift correction, metres
  lr_pose_final: 0.1       # camera learning rates decay to this share by the last step
  log_every: 200
  eval_views: 5

train:                     # Gaussians on the SLAM's map and poses (scripts/run_gaussians.py)
  slam_run: null           # SLAM run folder with map.pt: absolute, or relative to
                           # <VG_OUTPUT_ROOT>/<dataset>/ (e.g. 2026-11-22_150000_base)
  stride: 4                # training images: keep every n-th pixel (1200x680 -> 300x170)
  keyframe_every: 1        # train on every n-th keyframe (2 = half of them)
  max_heldout: 100         # held-out frames, halfway between keyframes (never fused, never trained)
  poses: frozen            # frozen or trainable: cameras trained with the blobs after
                           # refine.warmup steps (the first keyframe never moves)

surface:                   # one shared voxel-Gaussian surface (optimization/shared_surface.py)
  mode: free               # free: blobs move freely within refine.anchor_radius (Steps 1-2)
                           # tied: blobs ride on the fused surface, the surface stays (Step 3)
                           # learned: the photos also correct the surface (Step 4)
  lr_dphi: 1.0e-4          # surface correction learning rate, m
  start: 200               # steps of blob-only training before the surface learns
  dphi_from: both          # both: colour + depth loss move the surface; color: colour only
                           # (shows what the photos add beyond the depth sensor)
  dphi_free: 0.01          # correction free up to this, m; squared penalty beyond
  dphi_weight: 100.0
  slide_free: 0.5          # sliding along the surface free up to this, voxels
  slide_weight: 100.0
  lift_max: 0.0            # cap of a blob's own offset off the surface, voxels (0 = off, so
                           # every move along the normal goes into the surface)
  tilt_free_deg: 15.0      # disc tilt from the surface normal free up to this
  tilt_weight: 1.0
  score: true              # surface accuracy against a fine map fused from the true poses
  reference_voxel: 0.01    # its voxel size, m
  reference_stride: 2      # its depth images: keep every n-th pixel
  realign_iters: 10        # after training: align each training keyframe's depth to the map,
                           # plain and corrected (0 = off)
  realign_points: 2000     # depth points per keyframe
  realign_huber: 0.02      # gaps beyond this count linearly, m

depth_noise:               # synthetic depth noise added when reading depth (0 = off): the
                           # controlled test on Replica, whose rendered depth is perfect
  sigma: 0.0               # per-pixel standard deviation, m ...
  sigma_quad: 0.0          # ... plus this x depth^2 (Kinect ~0.0025)
  smooth_cells: 0          # also a smooth per-frame error of the same size: a random field on
                           # this many cells across the image, blended (0 = off). Unlike
                           # per-pixel noise, it doesn't average out within one view
  seed: 0

dense_ba:                  # all keyframe poses corrected together (scripts/run_dense_ba.py)
  stride: 4                # input images: keep 1 of 4 pixels each way (brightness averaged)
  points: 3000             # pixels compared per keyframe (half random, half strongest edges)
  cell: 0.2                # graph: the scene is cut into cells this big, m; two keyframes are
  min_overlap: 0.3         # linked when they share this share of the smaller one's cells
  near: 4                  # links kept per keyframe among keyframes within far_gap in time
  far: 6                   # links kept among the others: revisits, the links that see drift
  far_gap: 15              # keyframes
  sigma_depth: 0.002       # typical depth gap of a correct pixel pair, m ...
  sigma_depth_quad: 0.0    # ... plus this x depth^2 (Kinect ~0.0025; rendered depth: 0)
  sigma_color: 0.03        # typical brightness gap (0..1)
  color_weight: 1.0        # 0 = depth only (converges far slower: flat walls slide)
  huber: 2.0               # gaps beyond this many sigmas count linearly (wrong pairs)
  gates: [0.08, 0.03]      # per level, coarse -> fine: drop pairs whose depths differ more, m
  levels: [2, 1]           # per level: shrink of the input images (2 = half size)
  iterations: [10, 10]     # Gauss-Newton steps per level (stops earlier when nothing moves)
  damping: 1.0e-4          # Levenberg-Marquardt start
  max_drop: 0.03           # a step may lose at most this share of the pixel pairs
  spring_trans: 0.005      # consecutive keyframes keep the SLAM's motion between them within
  spring_rot_deg: 0.25     # about this much (soft): stops a keyframe seeing one flat wall
                           # from sliding along it
  chunk: 256               # pairs evaluated together (memory)
  frames: all              # then every other frame is aligned to its two neighbouring
                           # keyframes (held fixed): all, heldout (only the frames
                           # run_gaussians.py scores, with train.max_heldout) or none
  frame_chunk: 150         # frames aligned together (memory)

schedule:                  # rounds of fuse -> snap -> re-fuse -> Gaussians -> refine
  rounds: 3
  stop_deg: 0.01           # stop early: mean camera rotation change between rounds
  stop_mm: 0.5             # stop early: mean camera position change between rounds

render:
  budget_mb: 512           # memory budget of the tiled renderer
  background: [0.0, 0.0, 0.0]
  depth: center            # rendered depth per blob: center (its centre's depth everywhere it
                           # covers; biased towards the camera on slanted walls) or plane (where
                           # each pixel's ray meets the blob's disc)
